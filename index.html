<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Инвентаризация Java · Java4Shell</title>
<style>
:root{color-scheme:light dark;--bg:#101921;--card:#172630;--line:#314652;--ink:#f0f5f4;--muted:#a9bdc7;--accent:#8ce9c1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Geist",system-ui,sans-serif}
main{width:min(1100px,calc(100% - 36px));margin:58px auto}
h1,h2,h3,p{margin:0}h1{font-size:clamp(28px,5vw,52px);letter-spacing:-.04em}h2{font-size:23px}
header p,.hint,dt,output{color:var(--muted)}header p{margin:.4rem 0 1.9rem}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
section{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:23px;min-width:0}
form, .status{display:grid;gap:12px;margin-top:15px}form{min-height:245px}
label{display:grid;gap:4px;font-size:.9rem}
input:not([type=checkbox]),select{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
input[type=checkbox]{accent-color:var(--accent)}.check{display:flex;align-items:center;gap:7px}
button{align-self:end;width:max-content;padding:9px 16px;border:0;border-radius:7px;color:#10251d;background:var(--accent);font:inherit;font-weight:650;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.status{border-top:1px solid var(--line);padding-top:15px}
dl{margin:5px 0 0;display:grid;grid-template-columns:1fr auto;gap:5px 16px;font-size:.9rem}
dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
.hint,output{font-size:.82rem;overflow-wrap:anywhere}
h3{font-size:1rem}a{color:var(--accent)}.reports{display:flex;flex-wrap:wrap;gap:15px}
[hidden]{display:none!important}.error{color:#ffb3ac}
.tabs,.pagination{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.tabs button,.pagination button{background:transparent;color:var(--ink);border:1px solid var(--line)}
.tabs button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.pagination{margin:16px 0 0}
.result-list{padding:0;margin:12px 0 0;list-style:none}
.result-list>li{padding:11px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.result-list details{margin-top:6px}.result-list summary{cursor:pointer;color:var(--muted)}
.result-list details ul{padding-left:22px}
@media(max-width:760px){main{margin:25px auto}.grid{grid-template-columns:1fr}form{min-height:0}}
</style>
</head>
<body>
<main>
<header>
<h1>Инвентаризация Java</h1>
<p><a href="/architecture">Как работает опрос</a></p>
</header>
<nav class="tabs" aria-label="Раздел">
<button data-view="scan" aria-pressed="true">Опрос</button>
<button data-view="bitbucket" aria-pressed="false">Репозитории Bitbucket</button>
<button data-view="nexus" aria-pressed="false">Образы Nexus</button>
</nav>
<div class="grid" id="scan">
<section id="bitbucket">
<h2>Bitbucket</h2>
<form>
<label>Платформа <select name="provider"><option value="datacenter">Data Center</option><option value="cloud">Cloud</option></select></label>
<label>Проекты <input name="projects" placeholder="Все доступные или APP, INFRA"></label>
<label>Дополнительные ветки <input name="branches" placeholder="release/*, support/*"></label>
<label>Профиль <select name="profile"><option value="java4shell">Java4Shell · CVE-2026-114938</option><option value="inventory">Инвентаризация по веткам</option></select></label>
<label class="java-majors" hidden>Мажорные версии Java <input name="javaMajors" value="17" placeholder="17,21,25,27" required disabled></label>
<label>Пауза между REST GET, с <input name="delay" type="number" min="0" step="any" value="0.1" required></label>
<button>Опросить Bitbucket</button>
</form>
<div class="status" aria-live="polite"><strong class="state">Готов к запуску</strong><div class="metrics"></div><output></output><pre class="hint diagnostics" hidden></pre><div class="reports"></div></div>
</section>
<section id="nexus">
<h2>Nexus Docker</h2>
<form>
<label>Docker-репозитории <input name="repositories" placeholder="Все hosted или docker-prod, docker-stage"></label>
<label>Профиль <select name="profile"><option value="java4shell">Java4Shell · CVE-2026-114938</option><option value="inventory">Инвентаризация по веткам</option></select></label>
<label class="java-majors" hidden>Мажорные версии Java <input name="javaMajors" value="17" placeholder="17,21,25,27" required disabled></label>
<label class="check"><input name="includeProxy" type="checkbox"> Включить закэшированные образы proxy</label>
<label>Пауза между запросами, с <input name="delay" type="number" min="0" step="any" value="0.1" required></label>
<button>Опросить Nexus</button>
</form>
<div class="status" aria-live="polite"><strong class="state">Готов к запуску</strong><div class="metrics"></div><output></output><pre class="hint diagnostics" hidden></pre><div class="reports"></div></div>
</section>
</div>
<section id="results" hidden>
<h2 id="result-title"></h2>
<label id="candidate-filter" class="check"><input id="candidates-only" type="checkbox"> Только кандидаты</label>
<p class="hint" id="result-status" aria-live="polite"></p>
<ul class="result-list" id="result-list"></ul>
<div class="pagination" aria-label="Страницы результатов">
<button id="prev-page" disabled>Назад</button>
<span id="page-number"></span>
<button id="next-page" disabled>Далее</button>
</div>
</section>
</main>
<script>
const sections = [...document.querySelectorAll('#scan section')];
const stateNames = {running:'Выполняется', done:'Завершён', partial:'Завершён с ошибками', failed:'Ошибка опроса'};
const seconds = value => value == null ? '—' : value.toFixed(3) + ' с';
function element(tag, value) {
  const node = document.createElement(tag);
  node.textContent = value;
  return node;
}
const resultPanel = document.querySelector('#results');
const resultList = document.querySelector('#result-list');
const resultStatus = document.querySelector('#result-status');
const candidatesOnly = document.querySelector('#candidates-only');
const previous = document.querySelector('#prev-page');
const next = document.querySelector('#next-page');
const pageNumber = document.querySelector('#page-number');
const seenReports = {};
let view = 'scan';
let resultPage = 1;
let resultRequest = 0;

function resultLink(text, url) {
  const link = element(url ? 'a' : 'span', text);
  if (url) {
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
  }
  return link;
}
function findingList(findings) {
  const list = element('ul', '');
  const labels = {candidate:'кандидат', outside_scope:'вне выбора', unknown_version:'версия неизвестна'};
  for (const finding of findings) {
    const line = element('li', '');
    const evidence = finding.evidence + (finding.line ? ':' + finding.line : '');
    const context = [finding.branch, finding.commit, finding.platform, finding.digest].filter(Boolean);
    line.append(element('p', [finding.version || '—', finding.product_version, labels[finding.status],
      finding.role, finding.vendor].filter(Boolean).join(' · ')), resultLink(evidence, finding.url));
    if (finding.policy_reason) line.append(element('p', finding.policy_reason));
    if (context.length) line.append(element('p', context.join(' · ')));
    list.append(line);
  }
  return list;
}
function resultItem(item) {
  const row = element('li', '');
  const details = element('details', '');
  if (view === 'nexus') {
    row.append(resultLink(item.title, item.url), element('span', ' · ' + item.repository));
    details.append(element('summary', 'Находок: ' + item.findings.length +
      ' · кандидатов: ' + item.findings.filter(finding => finding.status === 'candidate').length),
      findingList(item.findings));
  } else {
    const [finding] = item.findings;
    const version = finding.version || finding.java_major || finding.product_version;
    row.append(resultLink(item.title.split('/').at(-1), item.url),
      element('span', ' · кандидат · Java ' + version));
    const reason = finding.policy_reason === 'Affected Java branch; verify vendor build and patch level'
      ? 'Ветка Java входит в область проверки. Нужно сверить сборку поставщика и уровень обновления.'
      : finding.policy_reason || 'Версия Java соответствует критериям выбранного профиля.';
    row.append(element('p', reason),
      resultLink(finding.file + (finding.line ? ':' + finding.line : ''), finding.url));
    return row;
  }
  row.append(details);
  return row;
}
function resultsTree(items) {
  if (view === 'nexus') return items.map(resultItem);
  const projects = new Map();
  for (const item of items) {
    if (!projects.has(item.project)) projects.set(item.project, []);
    projects.get(item.project).push(item);
  }
  return [...projects].map(([project, repositories]) => {
    const row = element('li', '');
    const details = element('details', '');
    details.open = true;
    const list = element('ul', '');
    list.append(...repositories.map(resultItem));
    details.append(element('summary', project + ' · репозиториев на странице: ' + repositories.length), list);
    row.append(details);
    return row;
  });
}
async function showResults() {
  if (view === 'scan') return;
  const token = ++resultRequest;
  previous.disabled = next.disabled = true;
  resultList.replaceChildren();
  pageNumber.textContent = '';
  resultStatus.textContent = 'Загрузка…';
  try {
    const query = new URLSearchParams({page:resultPage, candidates:candidatesOnly.checked ? '1' : '0'});
    const response = await fetch('/api/results/' + view + '?' + query);
    const data = await response.json();
    if (token !== resultRequest) return;
    if (!response.ok) throw new Error(data.error);
    resultPage = data.page;
    if (!data.generatedAt) {
      resultStatus.textContent = 'Сначала запусти опрос этого источника.';
      return;
    }
    resultStatus.textContent = (view === 'bitbucket' ? 'Репозиториев-кандидатов: ' : 'Объектов: ') + data.total + ' · Java: ' + data.javaMajors.join(', ') +
      ' · Опрос: ' + new Date(data.generatedAt).toLocaleString('ru-RU');
    if (data.profile === 'java4shell') resultStatus.textContent += ' · CVE-2026-114938';
    if (!data.items.length) resultStatus.textContent += ' · Совпадений нет';
    resultList.replaceChildren(...resultsTree(data.items));
    pageNumber.textContent = data.page + ' / ' + data.pages;
    previous.disabled = data.page <= 1;
    next.disabled = data.page >= data.pages;
  } catch (error) {
    if (token === resultRequest) resultStatus.textContent = error.message;
  }
}
const tabs = [...document.querySelectorAll('.tabs button')];
for (const tab of tabs) tab.addEventListener('click', () => {
  ++resultRequest;
  view = tab.dataset.view;
  resultPage = 1;
  for (const item of tabs) item.setAttribute('aria-pressed', String(item === tab));
  document.querySelector('#scan').hidden = view !== 'scan';
  resultPanel.hidden = view === 'scan';
  document.querySelector('#candidate-filter').hidden = view !== 'nexus';
  document.querySelector('#result-title').textContent = tab.textContent;
  showResults();
});
candidatesOnly.addEventListener('change', () => { resultPage = 1; showResults(); });
previous.addEventListener('click', () => { resultPage--; showResults(); });
next.addEventListener('click', () => { resultPage++; showResults(); });
function showStats(target, title, data) {
  target.append(element('h3', title));
  const list = document.createElement('dl');
  const values = [
    ['Всего / ошибок', data.count + ' / ' + data.errors],
    ['Последний ответ', seconds(data.last)],
    ['Среднее время', seconds(data.count ? data.total / data.count : null)],
    ['Максимальное время', seconds(data.count ? data.max : null)]
  ];
  if (data.http_status) values.push(['Последний HTTP-статус', data.http_status]);
  for (const [label, value] of values) list.append(element('dt', label), element('dd', value));
  target.append(list);
  if (data.operation) {
    const detail = element('p', data.operation);
    detail.className = 'hint';
    target.append(detail);
  }
}
function render(section, job) {
  section.querySelector('button').disabled = job.state === 'running';
  section.querySelector('.state').textContent = stateNames[job.state] + ' · ' + Math.floor(job.elapsed) + ' с';
  const metrics = section.querySelector('.metrics');
  metrics.replaceChildren();
  showStats(metrics, section.id === 'nexus' ? 'Nexus API · GET / POST' : 'REST GET', job.http);
  if (section.id === 'nexus') showStats(metrics, 'Операции Docker Registry', job.registry);
  if (section.id === 'bitbucket' && job.git) showStats(metrics, 'Git clone', job.git);
  const report = job.summary;
  if (report) metrics.append(element('p', 'Объектов: ' + report.assets + ' · Кандидатов: ' + report.candidates + ' · Ошибок охвата: ' + report.errors));
  const output = section.querySelector('output');
  output.textContent = job.messages.at(-1) || '';
  output.className = job.state === 'failed' ? 'error' : '';
  const diagnostics = section.querySelector('.diagnostics');
  diagnostics.hidden = !job.diagnostics.length;
  diagnostics.style.whiteSpace = 'pre-wrap';
  diagnostics.textContent = job.diagnostics.join('\n');
  const links = section.querySelector('.reports');
  links.replaceChildren();
  for (const name of job.reports) {
    const link = element('a', name === 'candidates.csv' ? 'Кандидаты CSV' : 'Полный отчёт JSON');
    link.href = '/reports/' + section.id + '/' + job.id + '/' + name;
    links.append(link);
  }
}
let revision = 0;
async function refresh() {
  const requestRevision = revision;
  const response = await fetch('/api/status', {cache:'no-store'});
  if (!response.ok) throw new Error('Статистика сервиса недоступна');
  const jobs = await response.json();
  if (requestRevision !== revision) return;
  for (const section of sections) {
    const job = jobs[section.id];
    if (!job) continue;
    render(section, job);
    if (job.reports.includes('inventory.json') && seenReports[section.id] !== job.id) {
      seenReports[section.id] = job.id;
      if (view === section.id) { resultPage = 1; showResults(); }
    }
  }
}
for (const section of sections) {
  const form = section.querySelector('form');
  form.elements.profile.addEventListener('change', () => {
    const custom = form.elements.profile.value === 'inventory';
    form.querySelector('.java-majors').hidden = !custom;
    form.elements.javaMajors.disabled = !custom;
  });
  form.addEventListener('submit', async event => {
    event.preventDefault();
    revision++;
    const button = section.querySelector('button');
    const output = section.querySelector('output');
    const settings = Object.fromEntries(new FormData(form));
    settings.includeProxy = !!form.elements.includeProxy?.checked;
    button.disabled = true;
    output.textContent = '';
    try {
      const response = await fetch('/api/start/' + section.id, {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(settings)
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error);
      await refresh();
    } catch (error) {
      output.className = 'error';
      output.textContent = error.message;
      button.disabled = false;
    }
  });
}
async function poll() {
  try { await refresh(); }
  catch (error) { for (const section of sections) section.querySelector('output').textContent = error.message; }
  finally { setTimeout(poll, 1000); }
}
async function init() {
  try {
    const response = await fetch('/api/config');
    if (response.ok) {
      const config = await response.json();
      if (['cloud','datacenter'].includes(config.bitbucketProvider)) {
        document.querySelector('#bitbucket select').value = config.bitbucketProvider;
      }
    }
  } finally {
    poll();
  }
}
init().catch(() => {});
</script>
</body>
</html>
