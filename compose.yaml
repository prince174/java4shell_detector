services:
  inventory:
    build:
      context: .
      args:
        GO_BASE_IMAGE: "${GO_BASE_IMAGE:-golang:1.26-alpine}"
        PYTHON_BASE_IMAGE: "${PYTHON_BASE_IMAGE:-python:3.13-slim}"
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
        GOSUMDB: "${GOSUMDB:-sum.golang.org}"
    ports:
      - "127.0.0.1:${JAVA4SHELL_PORT:-8080}:8080"
    env_file:
      - path: .env
        format: raw
        required: false
    volumes:
      - ./reports:/reports
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/api/config', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 3
