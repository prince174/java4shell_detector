services:
  java4shell_detector:
    user: "${JAVA4SHELL_RUN_AS:-10001:10001}"
    build:
      context: .
      args:
        GOPROXY: "${GOPROXY:-}"
        GOSUMDB: "${GOSUMDB:-}"
    ports:
      - "127.0.0.1:${JAVA4SHELL_PORT:-8080}:8080"
    env_file:
      - path: .env
        format: raw
        required: false
    volumes:
      - ./reports:/reports
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/api/config', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 3
